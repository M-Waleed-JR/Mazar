<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <title>مزار | (Mazar)</title>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- خطوط جوجل (Cairo للعربية و Montserrat للإنجليزية) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- مكتبة Leaflet للخرائط -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />

    <!-- مكتبة SweetAlert2 للتنبيهات -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body>
    <div class="container">
      <!-- حاوية الخريطة -->
      <div id="mapContainer"></div>

      <!-- كارت البحث العصري العائم -->
      <aside class="bst-sidebar">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="bst-filter">
          <header class="app-header">
            <div class="brand-row">
              <div class="brand-badge-icon">🏨</div>
              <div>
                <h1>مزار <span class="brand-en">(Mazar)</span></h1>
                <p class="subtitle">دليلك لاستكشاف أفضل الفنادق حول العالم</p>
              </div>
            </div>
          </header>

          <form id="input_search">
            <!-- حقل البحث الموحد والذكي -->
            <div class="search-field-container">
              <label class="field-label" for="search">الدولة</label>
              <div class="search-input-wrapper">
                <span class="search-icon">
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                </span>
                <input
                  type="text"
                  id="search"
                  placeholder="اكتب اسم الدولة أو انقر للاختيار..."
                  autocomplete="off"
                />
                <button
                  type="button"
                  id="clear_search"
                  class="clear-search-btn"
                  title="تفريغ الحقل"
                >
                  ✕
                </button>
              </div>

              <!-- القائمة المنسدلة الذكية -->
              <ul id="auto_suggest_list" class="smart-dropdown"></ul>
            </div>

            <!-- اختصارات سريعة لأشهر الدول -->
            <div class="quick-tags-section">
              <span class="tags-label">وجهات شائعة:</span>
              <div class="tags-group">
                <button type="button" class="tag-chip" data-country="Egypt">
                  🇪🇬 Egypt
                </button>
                <button type="button" class="tag-chip" data-country="Germany">
                  🇩🇪 Germany
                </button>
                <button
                  type="button"
                  class="tag-chip"
                  data-country="El Salvador"
                >
                  🇸🇻 El Salvador
                </button>
              </div>
            </div>

            <!-- زر البحث الاحترافي -->
            <button type="submit" id="submit" class="lis-primary-btn">
              <span class="btn-text">بحث في الخريطة</span>
              <span class="btn-arrow">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="19" y1="12" x2="5" y2="12"></line>
                  <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
              </span>
            </button>
          </form>

          <!-- ملخص النتائج -->
          <div id="results_summary" class="results-box" style="display: none">
            <div class="results-info">
              <span class="results-icon">📍</span>
              <span id="results_text">تم العثور على 0 أماكن</span>
            </div>
            <button type="button" id="clear_markers_btn" class="clear-btn">
              مسح
            </button>
          </div>
        </div>
      </aside>
    </div>

    <!-- استدعاء Leaflet أولاً ثم ملف السكربت -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
  </body>
</html>
